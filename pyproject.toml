[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bacakan"
version = "1.0.0"
description = "TTS Bahasa Indonesia yang jalan lokal: antarmuka web dan terminal, ekspor WAV atau MP3."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bacakan contributors" }]
keywords = ["tts", "text-to-speech", "indonesian", "supertonic", "onnx"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["supertonic>=1.3,<2"]

[project.scripts]
bacakan = "bacakan.server:main"
bacakan-cli = "bacakan.cli:main"

[tool.setuptools.packages.find]
include = ["bacakan*"]

[tool.setuptools.package-data]
bacakan = ["templates/*.html"]
